# Production overrides: no host ports for mongo/api; web only on Caddy Docker network.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#        docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
#
# Set GHCR_IMAGE_API, GHCR_IMAGE_WEB (CI writes these), CADDY_DOCKER_NETWORK, CORS_ORIGINS.

services:
  mongo:
    ports: []

  api:
    image: ${GHCR_IMAGE_API:?Set GHCR_IMAGE_API}
    ports: []
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to your HTTPS origin}

  inpost-web:
    image: ${GHCR_IMAGE_WEB:?Set GHCR_IMAGE_WEB}
    ports: []
    networks:
      - default
      - caddy

networks:
  caddy:
    external: true
    name: ${CADDY_DOCKER_NETWORK:?Set CADDY_DOCKER_NETWORK to your Caddy stack network}
