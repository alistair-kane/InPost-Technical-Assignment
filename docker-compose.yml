# Production stack (deployed by GitHub Actions). For local dev, also pass docker-compose.dev.yml.
services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    environment:
      MONGODB_URI: mongodb://mongo:27017/inpost_assignment
      MONGODB_DB: inpost_assignment
      MONGODB_COLLECTION: inpost_point_google_places
      MAP_DASHBOARD_API_SECRET: ${MAP_DASHBOARD_API_SECRET:?Set MAP_DASHBOARD_API_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
    depends_on:
      - mongo
    restart: unless-stopped

  inpost-web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:?Set NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
        NEXT_PUBLIC_GOOGLE_MAP_ID: ${NEXT_PUBLIC_GOOGLE_MAP_ID:?Set NEXT_PUBLIC_GOOGLE_MAP_ID}
    environment:
      FASTAPI_URL: http://api:8000
      MAP_DASHBOARD_API_SECRET: ${MAP_DASHBOARD_API_SECRET:?Set MAP_DASHBOARD_API_SECRET}
      NODE_ENV: production
    depends_on:
      - api
    networks:
      - default
      - caddy
    restart: unless-stopped

networks:
  caddy:
    external: true
    name: ${CADDY_DOCKER_NETWORK:?Set CADDY_DOCKER_NETWORK}

volumes:
  mongo_data:
