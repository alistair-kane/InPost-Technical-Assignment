name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload project to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "."
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 0
          overwrite: true
          rm: false
          tar_dereference: true
          exclude: .git,node_modules,**/.next,**/__pycache__,.venv,.venv-test,.cursor

      - name: Restart stack with Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        env:
          MAP_DASHBOARD_API_SECRET: ${{ secrets.MAP_DASHBOARD_API_SECRET }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_GOOGLE_MAP_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAP_ID }}
          CADDY_DOCKER_NETWORK: ${{ secrets.CADDY_DOCKER_NETWORK }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: MAP_DASHBOARD_API_SECRET,CORS_ORIGINS,NEXT_PUBLIC_GOOGLE_MAPS_API_KEY,NEXT_PUBLIC_GOOGLE_MAP_ID,CADDY_DOCKER_NETWORK
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            : "${MAP_DASHBOARD_API_SECRET:?MAP_DASHBOARD_API_SECRET is required}"
            : "${CORS_ORIGINS:?CORS_ORIGINS is required}"
            : "${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:?NEXT_PUBLIC_GOOGLE_MAPS_API_KEY is required}"
            : "${NEXT_PUBLIC_GOOGLE_MAP_ID:?NEXT_PUBLIC_GOOGLE_MAP_ID is required}"
            : "${CADDY_DOCKER_NETWORK:?CADDY_DOCKER_NETWORK is required}"

            umask 077
            printf '%s\n' \
              "MAP_DASHBOARD_API_SECRET=${MAP_DASHBOARD_API_SECRET}" \
              "CORS_ORIGINS=${CORS_ORIGINS}" \
              "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}" \
              "NEXT_PUBLIC_GOOGLE_MAP_ID=${NEXT_PUBLIC_GOOGLE_MAP_ID}" \
              "CADDY_DOCKER_NETWORK=${CADDY_DOCKER_NETWORK}" > .env

            docker compose up -d --build --force-recreate --remove-orphans
            docker compose ps
