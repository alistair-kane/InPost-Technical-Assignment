# Local development overlay: publish ports and skip the external Caddy network.
services:
  mongo:
    ports:
      - "27017:27017"

  api:
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

  inpost-web:
    ports:
      - "3000:3000"
    networks:
      - default
